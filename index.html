<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Customer Portal — Alma Tire Companies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: radial-gradient(ellipse at 60% 20%, rgba(200,16,46,0.1) 0%, transparent 60%),
              linear-gradient(145deg, #060a0f 0%, #0d1117 60%, #161c24 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #e6eaf0;
}
.card {
  background: #161c24;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 44px 44px 36px;
  width: 420px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
}
.logo-wrap { text-align: center; margin-bottom: 8px; }
.logo-wrap img { max-height: 60px; max-width: 280px; object-fit: contain; }
.portal-title {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8b95a3;
  margin-bottom: 32px;
}
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #c8d4e0;
  margin-bottom: 6px;
  margin-top: 18px;
}
input {
  width: 100%;
  padding: 13px 14px;
  background: #1d2633;
  border: 1.5px solid rgba(255,255,255,0.09);
  border-radius: 8px;
  font-size: 15px;
  color: #e6eaf0;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
input:focus { border-color: #C8102E; box-shadow: 0 0 0 3px rgba(200,16,46,0.15); }
.btn-login {
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  background: #C8102E;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background .2s;
}
.btn-login:hover { background: #a50d26; }
.btn-login:active { transform: scale(0.99); }
.error-msg {
  display: none;
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(200,16,46,0.12);
  border: 1px solid rgba(200,16,46,0.3);
  border-radius: 6px;
  font-size: 13px;
  color: #ff7a7a;
  text-align: center;
}
.footer {
  margin-top: 32px;
  font-size: 11px;
  color: #4d5966;
  text-align: center;
  line-height: 1.7;
}
.footer a { color: #8b95a3; text-decoration: none; }
.footer a:hover { color: #c8d4e0; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <!-- Replace src with hosted logo URL or base64 if needed -->
    <img src="https://almatirecompanies.com/wp-content/uploads/2022/03/ATS-logo-horizontal-1.png"
         onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'"
         alt="Alma Tire Companies">
    <div id="logo-text" style="display:none;font-size:20px;font-weight:800;color:#C8102E;letter-spacing:2px;">ALMA TIRE COMPANIES</div>
  </div>
  <div class="portal-title">Fleet Customer Portal</div>

  <form id="login-form" onsubmit="doLogin(event)">
    <label class="field-label" for="pw-input">Portal Password</label>
    <input type="password" id="pw-input" placeholder="Enter your password" autocomplete="current-password" required>
    <div class="error-msg" id="error-msg">Incorrect password. Please try again or contact Alma Tire.</div>
    <button type="submit" class="btn-login">Access Portal &rarr;</button>
  </form>
</div>

<div class="footer">
  Need access? Contact <a href="mailto:customerservice@almatirecompanies.com">customerservice@almatirecompanies.com</a><br>
  &copy; Alma Tire Companies · ATS Fleet Service
</div>

<script>
// ── Customer configuration ────────────────────────────────────────────────────
// To add a new customer:
//   1. Generate SHA-256 hash of their password (use tools.keycdn.com/sha256 or similar)
//   2. Add an entry below with their hash and portal folder
//   3. Create their portal folder under fleet-portal/
//
// To change a customer's password:
//   1. Generate new SHA-256 hash
//   2. Update the hash value below
//   3. Communicate the new password to the customer

var CUSTOMERS = [
  {
    name:    'DRB Transport',
    hash:    '498b65a95e617afae2d48a43f6e85ee14a11f0e19ae3a0074badceead46436e6', // DRB-Fleet-2026
    portal:  'drb-transport/',
    token:   'drb-2026-fleet'
  }
  // Add more customers here:
  // { name:'XYZ Trucking', hash:'...sha256 of their password...', portal:'xyz-trucking/', token:'xyz-2026-fleet' }
];

async function sha256(message) {
  var msgBuffer = new TextEncoder().encode(message);
  var hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  var hashArray  = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

async function doLogin(e) {
  e.preventDefault();
  var pw  = document.getElementById('pw-input').value;
  var err = document.getElementById('error-msg');
  var btn = document.querySelector('.btn-login');

  btn.textContent = 'Checking…';
  btn.disabled = true;
  err.style.display = 'none';

  var hash = await sha256(pw);
  var match = null;
  for (var i = 0; i < CUSTOMERS.length; i++) {
    if (CUSTOMERS[i].hash === hash) { match = CUSTOMERS[i]; break; }
  }

  if (match) {
    // Store session token so the portal can verify the user came through login
    sessionStorage.setItem('alma_portal_token', match.token);
    sessionStorage.setItem('alma_portal_customer', match.name);
    window.location.href = match.portal;
  } else {
    err.style.display = 'block';
    btn.textContent = 'Access Portal →';
    btn.disabled = false;
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

// Auto-focus password field
document.getElementById('pw-input').focus();
</script>
</body>
</html>
