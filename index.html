<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Portal — Alma Tire Service</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .card {
      background: #161c24;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: stretch;
      gap: 3px;
      margin-bottom: 14px;
    }
    .logo-badge span {
      display: block;
      width: 9px;
      height: 30px;
      border-radius: 2px;
    }
    .logo-name {
      font-size: 22px;
      font-weight: 700;
      color: #e6eaf0;
      letter-spacing: 0.06em;
    }
    .logo-sub {
      font-size: 12px;
      color: #8b95a3;
      margin-top: 5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 18px;
      color: #e6eaf0;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #8b95a3;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.55;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8b95a3;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      background: #1d2633;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e6eaf0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="email"]:focus {
      border-color: #C8102E;
      box-shadow: 0 0 0 3px rgba(200,16,46,0.15);
    }
    input[type="email"]::placeholder { color: #4d5966; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: #C8102E;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      letter-spacing: 0.01em;
    }
    button:hover:not(:disabled) { background: #a50d26; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .msg.error {
      background: rgba(200,16,46,0.12);
      border: 1px solid rgba(200,16,46,0.3);
      color: #ff8a8a;
      display: block;
    }
    .msg.info {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      color: #86efac;
      display: block;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 28px 0 20px;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #4d5966;
      line-height: 1.6;
    }
    .footer a {
      color: #8b95a3;
      text-decoration: none;
    }
    .footer a:hover { color: #e6eaf0; }
    .picker { display: none; margin-top: 4px; }
    .picker-label {
      font-size: 13px;
      color: #8b95a3;
      margin-bottom: 12px;
    }
    .picker-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: #1d2633;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e6eaf0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .picker-item:hover { border-color: #C8102E; background: #232d3d; }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <div class="logo-badge">
        <span style="background:#C8102E"></span>
        <span style="background:#1d2633;border:1px solid rgba(255,255,255,0.12)"></span>
        <span style="background:#C8102E;opacity:0.55"></span>
        <span style="background:#1d2633;border:1px solid rgba(255,255,255,0.08)"></span>
      </div>
      <div class="logo-name">ALMA TIRE</div>
      <div class="logo-sub">Fleet Portal</div>
    </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Enter your work email address to access your fleet dashboard.</p>

    <form id="login-form" onsubmit="handleSubmit(event)" novalidate>
      <label for="email-input">Email Address</label>
      <input
        type="email"
        id="email-input"
        placeholder="you@yourcompany.com"
        autocomplete="email"
        spellcheck="false"
      />
      <button type="submit" id="submit-btn">Access My Portal</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="picker" id="picker">
      <div class="picker-label">That email has access to more than one portal. Pick one:</div>
      <div id="picker-list"></div>
    </div>

    <hr class="divider">

    <div class="footer">
      Need access or have a question?<br>
      Contact <a href="mailto:brad.wilson@almatire.com">Alma Tire Support</a>
    </div>

  </div>

  <script>
    async function handleSubmit(e) {
      e.preventDefault();
      var emailInput = document.getElementById('email-input');
      var btn        = document.getElementById('submit-btn');
      var msg        = document.getElementById('msg');
      var email      = emailInput.value.trim().toLowerCase();

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.className   = 'msg error';
        msg.textContent = 'Please enter a valid email address.';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Looking up your account…';
      msg.className   = 'msg';
      msg.textContent = '';
      document.getElementById('picker').style.display = 'none';

      try {
        var resp = await fetch('./customers.json?v=' + Date.now());
        if (!resp.ok) throw new Error('directory unavailable');
        var customers = await resp.json();

        var matches = customers.filter(function(c) {
          var emails = Array.isArray(c.emails)
            ? c.emails
            : (c.email ? [c.email] : []);
          return emails.map(function(x){ return x.toLowerCase(); }).indexOf(email) >= 0;
        });

        if (matches.length === 1) {
          msg.className   = 'msg info';
          msg.textContent = 'Portal found — redirecting you now…';
          setTimeout(function() {
            window.location.href = './' + matches[0].slug + '/';
          }, 700);
        } else if (matches.length > 1) {
          msg.className   = 'msg info';
          msg.textContent = 'Found ' + matches.length + ' portals for that email.';
          var list = document.getElementById('picker-list');
          list.innerHTML = '';
          matches.forEach(function(c) {
            var item = document.createElement('button');
            item.type = 'button';
            item.className = 'picker-item';
            item.textContent = c.name || c.slug;
            item.onclick = function() { window.location.href = './' + c.slug + '/'; };
            list.appendChild(item);
          });
          document.getElementById('picker').style.display = 'block';
          btn.disabled    = false;
          btn.textContent = 'Access My Portal';
        } else {
          msg.className   = 'msg error';
          msg.textContent = 'No portal found for that email address. Please contact your Alma Tire representative to request access.';
          btn.disabled    = false;
          btn.textContent = 'Access My Portal';
        }
      } catch(err) {
        msg.className   = 'msg error';
        msg.textContent = 'Unable to load the portal directory. Please try again or contact your Alma Tire representative.';
        btn.disabled    = false;
        btn.textContent = 'Access My Portal';
      }
    }

    // Allow Enter key on the email field
    document.getElementById('email-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('login-form').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
